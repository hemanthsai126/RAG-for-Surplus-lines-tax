name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff check
        run: ruff check app tests
      - name: Pytest
        env:
          SKIP_LLM: "1"
        run: pytest -q
      - name: Eval script (no index)
        run: python -m app.eval.run_eval --benchmark benchmarks/qa_sample.json
